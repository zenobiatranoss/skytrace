target-version = "py313"
line-length = 88

[lint]
# ruff's default rules (E4/E7/E9/F) plus import sorting, pyupgrade, bugbear,
# return and ruff-specific checks.
extend-select = ["I", "UP", "B", "RET", "RUF"]
# B008 fires on every FastAPI route because Depends() in the signature is the
# documented way to do dependency injection.
ignore = ["B008"]
